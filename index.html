<style>
:root {
  --neon: #2dff7e; --neon-soft: rgba(45,255,126,.45);
  --blue: #4f9df8; --bg: #070b16; --gold: #f6dd8a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Zain", "Cairo", sans-serif;
  color: #eef4ff;
  background:
    radial-gradient(1100px 550px at 85% -10%, rgba(25,118,210,.16) 0%, transparent 60%),
    radial-gradient(900px 500px at 8% 105%, rgba(45,255,126,.09) 0%, transparent 55%),
    radial-gradient(700px 400px at 50% 50%, rgba(124,77,255,.06) 0%, transparent 60%),
    #070b16;
  overflow: hidden;
  user-select: none;
}

/* ===== مجسمات 3D ===== */
.scene3d { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.orb { position: absolute; border-radius: 50%; filter: blur(2px); }
.orb1 { width: 280px; height: 280px; top: -70px; left: -80px;
  background: radial-gradient(circle at 35% 35%, rgba(45,255,126,.22), rgba(25,118,210,.07) 60%, transparent 75%);
  animation: floaty 12s ease-in-out infinite; }
.orb2 { width: 220px; height: 220px; bottom: 2%; right: -60px;
  background: radial-gradient(circle at 40% 40%, rgba(246,221,138,.16), transparent 70%);
  animation: floaty 15s ease-in-out infinite reverse; }
.orb3 { width: 150px; height: 150px; top: 42%; left: 4%;
  background: radial-gradient(circle at 40% 40%, rgba(147,112,255,.22), transparent 70%);
  animation: floaty 18s ease-in-out infinite; }
@keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-28px)} }
.ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(45,255,126,.3);
  box-shadow: 0 0 22px rgba(45,255,126,.22), inset 0 0 22px rgba(45,255,126,.12);
  transform: rotateX(72deg); }
.ring1 { width: 320px; height: 320px; top: 16%; right: 6%; animation: ringspin 22s linear infinite; }
.ring2 { width: 210px; height: 210px; bottom: 10%; left: 10%; animation: ringspin 16s linear infinite reverse; }
@keyframes ringspin { from{transform:rotateX(72deg) rotateZ(0)} to{transform:rotateX(72deg) rotateZ(360deg)} }

/* ===== المحتوى ===== */
.wrap {
  position: relative; z-index: 1;
  height: 100%; max-width: 480px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 24px; text-align: center;
}
.mushaf-img-wrap {
  border-radius: 24px; padding: 14px;
  background: rgba(255,255,255,.05);
  
  border: 1px solid rgba(45,255,126,.35);
  box-shadow: 0 0 40px rgba(45,255,126,.22), 0 18px 44px rgba(0,0,0,.45);
  animation: blockbreath 6.5s ease-in-out infinite;
}
@keyframes blockbreath {
  0%,100% { box-shadow: 0 0 30px rgba(45,255,126,.18), 0 18px 44px rgba(0,0,0,.45); transform: translateY(0); }
  50% { box-shadow: 0 0 52px rgba(45,255,126,.38), 0 22px 48px rgba(0,0,0,.5); transform: translateY(-12px); }
}
.mushaf-img { display: block; width: 210px; max-width: 55vw; height: auto;
  filter: drop-shadow(0 10px 26px rgba(0,0,0,.5)); }

.title-top {
  font-family: "Trox", "Zain", sans-serif;
  font-size: clamp(38px, 10vw, 56px); font-weight: 900; margin: 6px 0 0; line-height: 1.2;
  background: linear-gradient(120deg, #7ab8ff 10%, #2dff7e 55%, #7ab8ff 90%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 24px rgba(45,255,126,.35));
  animation: fadeup .8s ease both;
}
.title-sub {
  font-size: clamp(30px, 9vw, 44px); font-weight: 900; margin: 0; letter-spacing: 1px;
  background: linear-gradient(120deg, #f6dd8a 20%, #fff3c4 50%, #f6dd8a 80%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 22px rgba(246,221,138,.45));
  position: relative; padding-bottom: 14px; animation: fadeup .8s .15s ease both;
}
.title-sub::after {
  content: ""; position: absolute; bottom: 0; right: 50%; transform: translateX(50%);
  width: 130px; height: 3px; border-radius: 3px;
  background: linear-gradient(90deg, transparent, var(--neon), transparent);
  box-shadow: 0 0 14px rgba(45,255,126,.6);
}
.bism {
  font-family: "Amiri", serif; font-size: 27px; color: rgba(246,221,138,.9);
  margin: 2px 0 14px; animation: fadeup .8s .3s ease both;
}
.btn-enter .bism {
  margin: 0; animation: none; line-height: 1; direction: rtl; max-width: 100%;
  transform: translateX(9.5px);
  font-size: clamp(26px, 7vw, 32px); color: #f6dd8a;
  text-shadow: 0 0 18px rgba(246,221,138,.5), 0 2px 8px rgba(0,0,0,.65);
}
@keyframes fadeup { from{opacity:0; transform:translateY(22px)} to{opacity:1; transform:none} }

/* ===== زرار الدخول الكبير ===== */
.btn-enter {
  width: min(340px, 88vw); padding: 20px 18px;
  display: flex; align-items: center; justify-content: center; line-height: 1;
  border: 1.5px solid rgba(45,255,126,.55); border-radius: 20px; cursor: pointer;
  background: linear-gradient(160deg, rgba(45,255,126,.13) 0%, rgba(10,26,18,.92) 70%);
  
  box-shadow: 0 0 26px rgba(45,255,126,.28), 0 10px 26px rgba(0,0,0,.5),
              inset 0 1px 0 rgba(255,255,255,.12);
  transition: transform .15s, box-shadow .15s, background .15s, border-color .15s;
  animation: fadeup .8s .45s ease both, pulsebtn 2.4s 1.2s ease-in-out infinite;
}
.btn-enter:active {
  transform: scale(.97);
  background: linear-gradient(160deg, #43e57f 0%, #14c95c 55%, #0a9440 100%);
  border-color: rgba(45,255,126,.95);
  box-shadow: 0 0 38px rgba(45,255,126,.55), 0 8px 20px rgba(0,0,0,.5),
              inset 0 2px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,60,25,.45);
}
.btn-enter:active .bism {
  color: #03270f;
  text-shadow: 0 1px 0 rgba(255,255,255,.3);
}
.btn-enter:active { transform: scale(.96); }
@keyframes pulsebtn {
  0%,100% { box-shadow: 0 0 24px rgba(45,255,126,.45), 0 8px 24px rgba(0,0,0,.45); }
  50% { box-shadow: 0 0 44px rgba(45,255,126,.85), 0 8px 24px rgba(0,0,0,.45); }
}

/* ===== زرار الإضافة للشاشة الرئيسية ===== */
.btn-install {
  font-family: "Paxalah", "Zain", sans-serif;
  padding: 12px 26px; font-size: 16px; font-weight: 700; line-height: 1.3; cursor: pointer;
  color: #9cc8ff; border-radius: 14px;
  background: rgba(25,118,210,.12);
  border: 1.5px solid rgba(90,160,255,.5);
  
  transition: transform .15s, box-shadow .15s, background .15s;
  display: inline-flex; align-items: center; gap: 8px;
  animation: fadeup .8s .6s ease both;
}
.btn-install:active { transform: scale(.95); }
.btn-install svg { width: 17px; height: 17px; }
.btn-install.installed {
  color: var(--neon); border-color: rgba(45,255,126,.6);
  background: rgba(45,255,126,.08); pointer-events: none;
}
.install-hint {
  display: none; margin-top: 6px; font-size: 14px; color: #cfe3ff; line-height: 1.9;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
  border-radius: 12px; padding: 10px 16px; animation: fadeup .4s ease both;
}

/* ===== توست ===== */
.toast {
  position: fixed; bottom: 26px; right: 50%; transform: translateX(50%) translateY(90px);
  z-index: 99; padding: 12px 26px; border-radius: 14px;
  background: rgba(7,11,22,.85); backdrop-filter: blur(12px);
  border: 1px solid rgba(45,255,126,.5); color: #eafff3;
  font-size: 16px; font-weight: 700; box-shadow: 0 0 24px rgba(45,255,126,.25);
  transition: transform .35s cubic-bezier(.2,.9,.3,1.3);
}
.toast.show { transform: translateX(50%) translateY(0); }

/* ===== صفحة العرض ===== */
.reader {
  position: fixed; inset: 0; z-index: 5;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 20px;
  background:
    radial-gradient(1100px 550px at 85% -10%, rgba(25,118,210,.16) 0%, transparent 60%),
    radial-gradient(900px 500px at 8% 105%, rgba(45,255,126,.09) 0%, transparent 55%),
    #070b16;
  opacity: 0; transition: opacity .45s ease;
}
.reader.show { display: flex; }
.reader.visible { opacity: 1; }

/* بلوك A4 */
.page-block {
  position: relative;
  width: min(400px, 88vw);
  aspect-ratio: 1 / 1.4142;
  border-radius: 14px;
  background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  
  border: 1.5px solid rgba(45,255,126,.4);
  box-shadow: 0 0 34px rgba(45,255,126,.18), 0 20px 50px rgba(0,0,0,.55),
              inset 0 1px 0 rgba(255,255,255,.12);
  overflow: hidden;
  transition: transform .25s ease;
}
.page-block.turn-next { animation: turnNext .3s ease; }
.page-block.turn-prev { animation: turnPrev .3s ease; }
@keyframes turnNext { 0%{opacity:.3; transform:translateX(-18px) scale(.985)} 100%{opacity:1; transform:none} }
@keyframes turnPrev { 0%{opacity:.3; transform:translateX(18px) scale(.985)} 100%{opacity:1; transform:none} }

/* حاوية صفحات الـ PDF (Canvas أو IMG بيتinject هنا) */
#pdfPages { position: absolute; inset: 0; }
#pdfPages canvas, #pdfPages img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* البليس هولدر لما مفيش صفحة لسه */
.page-placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; font-family: "Amiri", serif; color: rgba(246,221,138,.85);
}
.page-placeholder .frame {
  width: 82%; height: 84%;
  border: 1.5px solid rgba(246,221,138,.35);
  outline: 1px solid rgba(246,221,138,.18); outline-offset: 5px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}

.page-placeholder.loading::after {
  content: ""; position: absolute; inset: 0; border-radius: 12px;
  background: linear-gradient(110deg, transparent 30%, rgba(45,255,126,.14) 50%, transparent 70%);
  background-size: 220% 100%;
  animation: shimmer 1.1s linear infinite;
}
@keyframes shimmer { from { background-position: 180% 0; } to { background-position: -40% 0; } }

.page-num {
  position: absolute; top: 10px; left: 0; right: 0; text-align: center;
  font-size: 15px; color: rgba(246,221,138,.75);
}

/* سهمين التنقل */
.nav-arrows { display: flex; align-items: center; gap: 34px; direction: rtl; }
.nav-btn {
  width: 56px; height: 56px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: rgba(45,255,126,.1);
  border: 1.5px solid rgba(45,255,126,.55);
  
  color: #2dff7e;
  box-shadow: 0 0 18px rgba(45,255,126,.25), 0 6px 16px rgba(0,0,0,.4);
  transition: transform .15s, box-shadow .15s, background .15s;
}
.nav-btn:active { transform: scale(.92); background: rgba(45,255,126,.28); box-shadow: 0 0 30px rgba(45,255,126,.5); }
.nav-btn svg { width: 24px; height: 24px; }
.nav-btn:disabled { opacity: .25; pointer-events: none; }
.nav-counter {
  font-family: "Paxalah", "Zain", sans-serif; font-size: 14px;
  color: #9cc8ff; min-width: 74px; text-align: center; direction: ltr;
}

/* زرار رجوع للصفحة الأولى */
.back-btn {
  position: absolute; top: 16px; right: 16px; z-index: 6;
  width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: rgba(25,118,210,.12); border: 1.5px solid rgba(90,160,255,.45);
  color: #9cc8ff; 
  transition: transform .15s, background .15s;
}
.back-btn:active { transform: scale(.92); background: rgba(25,118,210,.28); }
.back-btn svg { width: 20px; height: 20px; }


/* زرار التخصيص */
.custom-btn {
  margin-top: 4px;
  font-family: "Paxalah", "Zain", sans-serif;
  padding: 9px 26px; font-size: 14px; font-weight: 700; letter-spacing: .5px; cursor: pointer;
  color: #f6dd8a; border-radius: 13px; line-height: 1.3;
  background: rgba(246,221,138,.09);
  border: 1.5px solid rgba(246,221,138,.5);
  
  box-shadow: 0 0 16px rgba(246,221,138,.18), 0 6px 14px rgba(0,0,0,.4);
  transition: transform .15s, background .15s, box-shadow .15s;
}
.custom-btn:active { transform: scale(.94); background: rgba(246,221,138,.22); box-shadow: 0 0 26px rgba(246,221,138,.35); }

/* البلوك اللي بيطلع من زرار التخصيص */
.custom-overlay {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  background: rgba(4,7,14,.72);
  
  opacity: 0; pointer-events: none; transition: opacity .3s ease;
}
.custom-overlay.open { opacity: 1; pointer-events: auto; }
.custom-block {
  position: relative;
  width: min(360px, 90vw); min-height: 300px;
  border-radius: 20px; padding: 22px 20px 20px;
  background: linear-gradient(160deg, rgba(30,50,40,.92), rgba(10,20,15,.96));
  border: 1.5px solid rgba(246,221,138,.45);
  box-shadow: 0 0 40px rgba(246,221,138,.2), 0 24px 60px rgba(0,0,0,.6),
              inset 0 1px 0 rgba(255,255,255,.1);
  transform: translateY(26px) scale(.95); opacity: 0;
  transition: transform .32s cubic-bezier(.2,.9,.3,1.25), opacity .28s ease;
}
.custom-overlay.open .custom-block { transform: none; opacity: 1; }
.custom-block .head {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 12px; margin-bottom: 14px;
  border-bottom: 1px solid rgba(246,221,138,.22);
  font-family: "Paxalah", "Zain", sans-serif; color: #f6dd8a; font-size: 17px;
  text-shadow: 0 0 14px rgba(246,221,138,.35);
}
.custom-close {
  width: 32px; height: 32px; border-radius: 9px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: rgba(246,221,138,.08); border: 1px solid rgba(246,221,138,.35);
  color: #f6dd8a; font-size: 15px; line-height: 1;
  transition: background .15s, transform .15s;
}
.custom-close:active { transform: scale(.9); background: rgba(246,221,138,.2); }
.custom-body { min-height: 200px; }



/* ===== واجهة الانتقال السريع ===== */
.nav-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.nav-tab {
  flex: 1; padding: 8px 4px; border-radius: 10px; cursor: pointer; text-align: center;
  font-family: "Paxalah", "Zain", sans-serif; font-size: 13.5px; letter-spacing: .3px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14); color: #9cc8ff;
  transition: all .15s;
}
.nav-tab.active {
  background: rgba(246,221,138,.14); border-color: rgba(246,221,138,.65); color: #f6dd8a;
  box-shadow: 0 0 14px rgba(246,221,138,.25);
}
.nav-panel { display: none; }
.nav-panel.active { display: block; animation: panelin .25s ease; }
@keyframes panelin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

/* لوحة الصفحة */
.page-jump-row { display: flex; gap: 8px; direction: rtl; }
.page-jump-input {
  flex: 1 1 auto; min-width: 0; width: 100%; padding: 12px 10px; border-radius: 12px; font-size: 18px; text-align: center;
  font-family: "Paxalah", "Zain", sans-serif; color: #eef4ff;
  background: rgba(255,255,255,.07); border: 1.5px solid rgba(45,255,126,.45);
  outline: none; direction: rtl;
}
.page-jump-row { width: 100%; }
.go-btn { flex: 0 0 auto; white-space: nowrap; }
.page-jump-input:focus { border-color: #2dff7e; box-shadow: 0 0 14px rgba(45,255,126,.3); }
.go-btn {
  padding: 12px 22px; border-radius: 12px; cursor: pointer; border: 0;
  font-family: "Paxalah", "Zain", sans-serif; font-size: 15px;
  background: linear-gradient(135deg, #2dff7e, #14c95c); color: #03270f; font-weight: 800;
  box-shadow: 0 0 16px rgba(45,255,126,.4);
}
.go-btn:active { transform: scale(.94); }
.jump-hint { margin-top: 10px; font-size: 12px; color: rgba(232,238,248,.55); text-align: center; font-family: "Cairo", sans-serif; }

/* لوحة السور */
.surah-search {
  width: 100%; padding: 11px 14px; border-radius: 12px; margin-bottom: 10px;
  font-family: "Zain", sans-serif; font-size: 16px; color: #eef4ff;
  background: rgba(255,255,255,.07); border: 1.5px solid rgba(246,221,138,.4); outline: none;
}
.surah-search:focus { border-color: #f6dd8a; box-shadow: 0 0 14px rgba(246,221,138,.25); }
.surah-search::placeholder { color: rgba(232,238,248,.4); }
.surah-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-left: 4px; }
.surah-list::-webkit-scrollbar { width: 4px; }
.surah-list::-webkit-scrollbar-thumb { background: rgba(246,221,138,.4); border-radius: 4px; }
.surah-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 12px; border-radius: 10px; cursor: pointer; text-align: right;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
  transition: all .13s;
}
.surah-item:hover { background: rgba(246,221,138,.1); border-color: rgba(246,221,138,.45); }
.surah-item:active { transform: scale(.98); }
.surah-item .sname {
  font-family: "Amiri", serif; font-size: 19px; font-weight: 700;
  background: linear-gradient(120deg, #f6dd8a, #fff3c4, #f6dd8a);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 8px rgba(246,221,138,.3));
}
.surah-item .spage { font-family: "Paxalah", "Zain", sans-serif; font-size: 12px; color: #9cc8ff; direction: ltr; }
.surah-empty { text-align: center; color: rgba(232,238,248,.5); padding: 18px; font-family: "Cairo", sans-serif; font-size: 14px; }

/* شبكات الحزب والربع */
.unit-grid { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; padding-left: 4px; }
.unit-grid::-webkit-scrollbar { width: 4px; }
.unit-grid::-webkit-scrollbar-thumb { background: rgba(246,221,138,.4); border-radius: 4px; }
.unit-grid.hizb { grid-template-columns: repeat(6, 1fr); }
.unit-grid.rub { grid-template-columns: repeat(8, 1fr); }
.unit-btn {
  padding: 9px 2px; border-radius: 9px; cursor: pointer; text-align: center;
  font-family: "Paxalah", "Zain", sans-serif; font-size: 13px; color: #9cc8ff;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.13);
  transition: all .13s;
}
.unit-btn:active { transform: scale(.92); background: rgba(45,255,126,.2); border-color: rgba(45,255,126,.6); color: #2dff7e; }

/* قائمة السجدات */
.sajda-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; padding-left: 4px; }
.sajda-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 10px; cursor: pointer;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); transition: all .13s;
}
.sajda-item:hover { background: rgba(45,255,126,.09); border-color: rgba(45,255,126,.45); }
.sajda-item:active { transform: scale(.98); }
.sajda-num {
  flex: 0 0 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-family: "Paxalah", sans-serif; font-size: 13px; color: #2dff7e;
  background: rgba(45,255,126,.12); border: 1px solid rgba(45,255,126,.4);
}
.sajda-name { flex: 1; font-family: "Amiri", serif; font-size: 17px; color: #eef4ff; }
.sajda-page { font-family: "Paxalah", sans-serif; font-size: 12px; color: #9cc8ff; direction: ltr; }

/* سطر "أنت هنا" */
.you-are-here {
  margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(246,221,138,.2);
  text-align: center; font-family: "Paxalah", "Zain", sans-serif; font-size: 17px; color: #9cc8ff;
}
.you-are-here b { color: #f6dd8a; font-weight: 700; }
.you-are-here .eq {
  color: #2dff7e; font-weight: 800; margin: 0 3px;
  text-shadow: 0 0 10px rgba(45,255,126,.6);
}


/* زرار خادم المصحف */
.server-btn {
  display: block; width: min(320px, 80vw); margin-top: 6px;
  padding: 9px 12px; border-radius: 12px; text-align: center; text-decoration: none;
  font-family: "Paxalah", "Zain", sans-serif; font-size: 13px; letter-spacing: .4px;
  color: rgba(246,221,138,.75);
  background: rgba(246,221,138,.06);
  border: 1px solid rgba(246,221,138,.28);
  transition: background .15s, border-color .15s, transform .15s;
}
.server-btn:hover { background: rgba(246,221,138,.13); border-color: rgba(246,221,138,.5); }
.server-btn:active { transform: scale(.97); }


/* ===== نسخة الديسكتوب (لاب/كمبيوتر) — لا تؤثر على الموبايل إطلاقاً ===== */
@media (min-width: 900px) and (pointer: fine), (min-width: 1024px) {
  /* الواجهة الافتتاحية: توزيع عرضي (بلوك يمين × نصوص شمال) */
  .wrap {
    max-width: 1150px; width: 94vw; padding: 40px;
    display: grid; grid-template-columns: 1.05fr 1fr; align-items: center;
    column-gap: 30px; row-gap: 10px;
  }
  /* ضبط المساحات: العنوانين لازقين، مساحة أوسع قبل البسملة، زراير قريبة */
  .wrap .title-sub { margin-top: -10px; margin-bottom: 30px; }
  .mushaf-img-wrap { grid-row: 1 / span 6; grid-column: 1; justify-self: center; }
  .mushaf-img-wrap .mushaf-img { width: min(380px, 30vw); }
  .title-top, .title-sub, .btn-enter, .btn-install, .install-hint, .server-btn { grid-column: 2; justify-self: center; }
  .mushaf-img { width: 300px; }

  /* انتشار المجسمات 3D على العرض */
  .orb1 { width: 400px; height: 400px; top: -100px; left: -120px; }
  .orb2 { width: 320px; height: 320px; bottom: 4%; right: -80px; }
  .orb3 { width: 220px; height: 220px; top: 46%; left: 42%; }
  .ring1 { width: 460px; height: 460px; top: 8%; right: 3%; }
  .ring2 { width: 300px; height: 300px; bottom: 6%; left: 4%; }

  .title-top { font-size: clamp(64px, 7vw, 92px); }
  .title-sub { font-size: clamp(42px, 4.5vw, 58px); }
  /* الزراير التلاتة: نفس العرض، نص متوسط مظبوط، خط أوضح */
  .btn-enter { width: 430px; padding: 18px 20px; font-size: 33px; }
  .btn-install { width: 430px; height: 64px; font-size: 19px; padding: 0 20px;
    display: flex; align-items: center; justify-content: center; line-height: 1.3; }
  .server-btn { width: 430px; height: 64px; font-size: 17px; padding: 0 16px;
    display: flex; align-items: center; justify-content: center; line-height: 1.3; }

  /* القارئ: البلوك A4 بيملى الشاشة بشكل أنيق */
  .reader { gap: 20px; }
  .page-block { width: auto; height: min(84vh, 860px); }
  .nav-btn { width: 64px; height: 64px; }
  .nav-btn svg { width: 28px; height: 28px; }
  .nav-counter { font-size: 17px; min-width: 90px; }
  .custom-btn { font-size: 16px; padding: 11px 32px; }
  .back-btn { width: 48px; height: 48px; top: 20px; right: 20px; }

  /* بلوك التخصيص: أعرض وأريح */
  .custom-block { width: 540px; min-height: 380px; padding: 26px 26px 24px; }
  .custom-block .head { font-size: 20px; }
  .nav-tab { font-size: 15px; padding: 10px 6px; }
  .surah-list, .unit-grid, .sajda-list { max-height: 430px; }
  .surah-item .sname { font-size: 23px; }
  .surah-item .spage, .sajda-page { font-size: 13px; }
  .unit-grid.hizb { grid-template-columns: repeat(10, 1fr); }
  .unit-grid.rub { grid-template-columns: repeat(12, 1fr); }
  .unit-btn { font-size: 14px; padding: 10px 2px; }
  .sajda-name { font-size: 20px; }
  .sajda-num { flex-basis: 34px; height: 34px; }
  .page-jump-input { font-size: 22px; padding: 14px; }
  .go-btn { font-size: 17px; padding: 14px 28px; }
  .surah-search { font-size: 18px; padding: 13px 16px; }
  .you-are-here { font-size: 19px; margin-top: 16px; padding-top: 14px; }
}


/* ===== وضع الزوم ===== */
.zoom-btn {
  position: absolute; top: 10px; left: 10px; z-index: 5;
  width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10,20,15,.72); border: 1.5px solid rgba(246,221,138,.5);
  color: #f6dd8a; backdrop-filter: none;
  box-shadow: 0 0 12px rgba(0,0,0,.4);
  transition: transform .13s, background .13s;
}
.zoom-btn:active { transform: scale(.9); background: rgba(246,221,138,.2); }
.zoom-btn svg { width: 18px; height: 18px; }

.zoom-overlay {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(4,7,14,.97);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .22s ease;
}
.zoom-overlay.open { opacity: 1; pointer-events: auto; }
.zoom-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
.zoom-stage img {
  max-width: 94vw; max-height: 88vh; border-radius: 8px;
  box-shadow: 0 20px 70px rgba(0,0,0,.7);
  transition: transform .12s ease-out; will-change: transform; user-select: none; -webkit-user-drag: none;
}
.zoom-close { transition: opacity .4s;
  position: absolute; top: 14px; right: 14px; z-index: 3;
  width: 44px; height: 44px; border-radius: 12px; cursor: pointer; font-size: 18px;
  background: rgba(255,255,255,.07); border: 1.5px solid rgba(246,221,138,.5); color: #f6dd8a;
  transition: transform .13s, background .13s;
}
.zoom-close:active { transform: scale(.9); background: rgba(246,221,138,.2); }
.zoom-counter { transition: opacity .4s;
  position: absolute; top: 22px; left: 18px; z-index: 3;
  font-family: "Paxalah", "Zain", sans-serif; font-size: 15px; color: #9cc8ff; direction: ltr;
}
.zoom-bar {
  transition: opacity .4s;
  position: absolute; bottom: 18px; right: 50%; transform: translateX(50%); z-index: 3;
  display: flex; gap: 8px;
}
.zoom-bar button {
  min-width: 46px; padding: 10px 14px; border-radius: 11px; cursor: pointer;
  font-family: "Paxalah", "Zain", sans-serif; font-size: 16px; color: #2dff7e;
  background: rgba(45,255,126,.09); border: 1.5px solid rgba(45,255,126,.45);
  transition: transform .13s, background .13s;
}
.zoom-bar button:active { transform: scale(.92); background: rgba(45,255,126,.25); }
@media (min-width: 900px) and (pointer: fine), (min-width: 1024px) {
  .zoom-btn { width: 46px; height: 46px; top: 12px; left: 12px; }
  .zoom-btn svg { width: 21px; height: 21px; }
}


/* ===== علامة المصحف ===== */
.mark-btn {
  position: absolute; top: 10px; right: 10px; z-index: 5;
  width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10,20,15,.72); border: 1.5px solid rgba(45,255,126,.5);
  color: #2dff7e;
  box-shadow: 0 0 12px rgba(0,0,0,.4);
  transition: transform .13s, background .13s;
}
.mark-btn:active { transform: scale(.9); background: rgba(45,255,126,.2); }
.mark-btn svg { width: 18px; height: 18px; }

.mark-menu {
  position: absolute; top: 56px; right: 10px; z-index: 6;
  display: none; flex-direction: column; gap: 6px; width: 190px;
  background: rgba(12,22,18,.96); border: 1.5px solid rgba(246,221,138,.4);
  border-radius: 13px; padding: 9px;
  box-shadow: 0 14px 40px rgba(0,0,0,.55);
}
.mark-menu.open { display: flex; animation: panelin .2s ease; }
.mark-menu button {
  padding: 10px 12px; border-radius: 9px; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  font-family: "Paxalah", "Zain", sans-serif; font-size: 14px; color: #eef4ff;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  transition: background .13s;
}
.mark-menu button svg { flex: 0 0 16px; width: 16px; height: 16px; }
#markSave svg { color: #f6dd8a; }
#markGo svg { color: #2dff7e; }
.mark-menu button:hover:not(:disabled) { background: rgba(45,255,126,.14); }
.mark-menu button:disabled { opacity: .35; cursor: default; }

/* الشارة النازلة — تيل شفاف تقرأ من تحتها */
.mark-ribbon {
  display: none; position: absolute; top: 0; right: 16px; z-index: 4;
  width: 26px; height: 17%; min-height: 68px; max-height: 132px;
  background: linear-gradient(180deg, rgba(24,160,132,.62), rgba(18,128,105,.5));
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%);
  box-shadow: 0 5px 16px rgba(0,0,0,.35);
  pointer-events: none;
}
@media (min-width: 900px) and (pointer: fine), (min-width: 1024px) {
  .mark-btn { width: 46px; height: 46px; top: 12px; right: 12px; }
  .mark-btn svg { width: 21px; height: 21px; }
  .mark-menu { top: 64px; right: 12px; width: 210px; }
  .mark-ribbon { width: 30px; right: 20px; }
}

/* ===== تسريع الأداء — GPU-only animations ===== */
.page-block, .custom-block, .mushaf-img-wrap, .nav-btn, .btn-enter, .btn-install,
.custom-btn, .back-btn, .orb, .ring, .cube { will-change: transform; }
.page-block { contain: layout paint; }
.custom-block { contain: layout; }
.btn-enter, .btn-install, .custom-btn, .nav-btn, .back-btn { touch-action: manipulation; }

/* فصل التوهج عن الحركة: عنصر حقيقي للحركة + ::after للتوهج (opacity بس) */
.btn-enter { position: relative; }
.btn-enter::after {
  content: ""; position: absolute; inset: -2px; border-radius: inherit; pointer-events: none;
  box-shadow: 0 0 46px rgba(45,255,126,.85);
  opacity: .12; animation: glowpulse 2.4s ease-in-out infinite 1.2s;
}
@keyframes glowpulse { 0%,100% { opacity: .12; } 50% { opacity: .45; } }
.btn-enter { animation: fadeup .8s .45s ease both; } /* شيلنا pulsebtn الأصلي */

.mushaf-img-wrap { animation: blockfloat 6.5s ease-in-out infinite; position: relative; }
.mushaf-img-wrap::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: 0 0 52px rgba(45,255,126,.38);
  opacity: .25; animation: glowpulse2 6.5s ease-in-out infinite;
}
@keyframes blockfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
@keyframes glowpulse2 { 0%,100% { opacity: .3; } 50% { opacity: .75; } }

/* احترام تقليل الحركة */
@media (prefers-reduced-motion: reduce) {
  .btn-enter::after, .mushaf-img-wrap::after, .mushaf-img-wrap, .orb, .ring { animation: none !important; }
}


/* ===== النسخة الخفيفة السريعة — موبايل ===== */
@media (pointer: coarse), (max-width: 768px) {
  .orb, .ring { animation: none !important; opacity: .55; }
  .mushaf-img-wrap { background: rgba(18,32,26,.82); animation-duration: 8s !important; }
  .mushaf-img-wrap::after { animation-duration: 8s !important; }
  .btn-enter::after { animation: none !important; opacity: .2; }
  .intro-deco { display: none; }
}
/* ديسكتوب: إبطاء الحركات بدل إيقافها */
@media (pointer: fine) and (min-width: 769px) {
  .orb { animation-duration: 26s !important; }
  .ring { animation-duration: 34s !important; }
}

</style>
</head>
<body>

<div class="scene3d">
  <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
  <div class="ring ring1"></div><div class="ring ring2"></div>
</div>

<main class="wrap">
  <div class="mushaf-img-wrap">
    <img class="mushaf-img" src="mushaf.webp" alt="المصحف الشريف">
  </div>

  <h1 class="title-top">منصة</h1>
  <h2 class="title-sub">المصحف الشريف</h2>

  <button id="enterBtn" class="btn-enter"><span class="bism">﷽</span></button>

  <button id="installBtn" class="btn-install">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    ضيف للشاشة الرئيسية
  </button>
  <div id="installHint" class="install-hint"></div>

  <!-- ✏️ عشان تربط الزرار بلينك: غيّر href="#" تحت للينك بتاعك -->
  <a id="serverBtn" class="server-btn" href="#">إعداد خادم المصحف الشريف: جاسر جمال</a>
</main>

<div id="toast" class="toast"></div>

<!-- ===== صفحة العرض ===== -->
<section id="reader" class="reader">
  <button id="backBtn" class="back-btn" aria-label="رجوع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <div class="page-block" id="pageBlock">
    <div id="pdfPages"></div>
    <div class="page-placeholder" id="pagePlaceholder">
      <div class="frame"><span style="font-size:26px">﴿ ﴾</span></div>
    </div>
    <button class="zoom-btn" id="zoomBtn" aria-label="تكبير الصفحة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <button class="mark-btn" id="markBtn" aria-label="العلامة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
    </button>
    <div class="mark-menu" id="markMenu">
      <button id="markSave">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
        احفظ العلامة
      </button>
      <button id="markGo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        انتقل إلى العلامة

    <div class="mark-ribbon" id="markRibbon"></div>
  </div>

  <div class="nav-arrows">

    </button>

</section>

<!-- بلوك التخصيص -->
<div class="custom-overlay" id="customOverlay">
  <div class="custom-block">

      <span>تخصيص</span>

      <button class="nav-tab active" data-tab="page">صفحة</button>
      <button class="nav-tab" data-tab="surah">سورة</button>
      <button class="nav-tab" data-tab="hizb">حزب</button>
      <button class="nav-tab" data-tab="rub">ربع</button>
      <button class="nav-tab" data-tab="sajda">سجدة</button>
    </div>

    <div class="nav-panel active" data-panel="page">

    <div class="nav-panel" data-panel="surah">

</div>



<!-- وضع الزوم -->
<div class="zoom-overlay" id="zoomOverlay">
  <div class="zoom-counter" id="zoomCounter"></div>
  <button class="zoom-close" id="zoomClose" aria-label="إغلاق">✕</button>
  <div class="zoom-stage" id="zoomStage"><img id="zoomImg" alt="صفحة المصحف"></div>
  <div class="zoom-bar">
    <button id="zoomOut" aria-label="تصغير">−</button>
    <button id="zoomReset">مناسب</button>
    <button id="zoomIn" aria-label="تكبير">+</button>
  </div>
</div>
<script>
/* ============ منصة المصحف الشريف — المحرك الكامل ============ */
const sfxClick = new Audio("audio/click.mp3");
const play = a => { a.currentTime = 0; a.play().catch(() => {}); };
const toArNum = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const toEn = s => String(s).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));

/* ============ زرار البسملة → فتح القارئ ============ */
document.getElementById("enterBtn").addEventListener("click", () => { openReader(); });

/* ============ PWA ============ */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  localStorage.removeItem("mushaf_installed");
  updateInstallBtn();
});
/* زرار الإضافة الذكي: يختفي لو التطبيق متثبت */
function updateInstallBtn() {
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const flagged = localStorage.getItem("mushaf_installed") === "1";
  installBtn.style.display = (standalone || flagged) ? "none" : "";
}
window.addEventListener("appinstalled", () => {
  localStorage.setItem("mushaf_installed", "1");
  updateInstallBtn();
  toast("تمت الإضافة للشاشة الرئيسية \u2713");
});
const installBtn = document.getElementById("installBtn");
updateInstallBtn(); /* فحص فوري: الزرار يختفي لو متثبت — قبل أول رسمة */
const hint = document.getElementById("installHint");
installBtn.addEventListener("click", async () => {
  play(sfxClick);
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === "accepted") toast("تمت الإضافة بنجاح \u2713");
    deferredPrompt = null;
  } else if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
    hint.style.display = "block";
    hint.innerHTML = "في آيفون: اضغط زر <b>المشاركة</b> \u23e0 ثم <b>أضف إلى الشاشة الرئيسية</b> \u2795";
  } else {
    hint.style.display = "block";
    hint.innerHTML = "من قائمة المتصفح (النقاط \u22ee) اختر <b>تثبيت التطبيق / إضافة إلى الشاشة الرئيسية</b>";
  }
});
document.getElementById("serverBtn").addEventListener("click", () => play(sfxClick));
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

/* ============ القارئ ============ */
const reader = document.getElementById("reader");
const pageBlock = document.getElementById("pageBlock");
const pdfPages = document.getElementById("pdfPages");
const placeholder = document.getElementById("pagePlaceholder");
const counterEl = document.getElementById("pageCounter");
const TOTAL_PAGES = 625;
let currentPage = 1;
let turning = false;

const coverImg = new Image();
coverImg.src = "cover.webp";
coverImg.alt = "غلاف المصحف الشريف";

function setPdfPage(el) {
  pdfPages.innerHTML = "";
  if (el) { pdfPages.appendChild(el); placeholder.style.display = "none"; }
  else placeholder.style.display = "flex";
}
const pageCache = {};
function showCurrentPage() {
  if (currentPage === 1) { setPdfPage(coverImg); prefetchAround(1); return; }
  const src = "pages/p" + String(currentPage - 1).padStart(3, "0") + ".webp";
  if (pageCache[src]) { setPdfPage(pageCache[src]); prefetchAround(currentPage); return; }
  placeholder.classList.add("loading");
  const el = new Image();
  el.onload = () => { placeholder.classList.remove("loading"); setPdfPage(el); };
  el.onerror = () => { placeholder.classList.remove("loading"); setPdfPage(null); };
  el.src = src;
  prefetchAround(currentPage);
}
function prefetchAround(cp) {
  [cp + 1, cp - 1].forEach(np => {
    if (np < 2 || np > TOTAL_PAGES) return;
    const src = "pages/p" + String(np - 1).padStart(3, "0") + ".webp";
    if (pageCache[src]) return;
    const im = new Image();
    im.onload = () => { pageCache[src] = im; };
    im.src = src;
  });
}
const PRINTED_TOTAL = 604;
function printedOf(cp) { return cp - 4; } /* قارئ 5 (أول صفحة ملف) = مطبوع ١ */
function render() {
  counterEl.textContent = currentPage === 1
    ? "\u0627\u0644\u063A\u0644\u0627\u0641"
    : currentPage < 5
      ? "\u0627\u0644\u0645\u0642\u062F\u0645\u0629"
      : currentPage > 608
        ? ABJAD[currentPage - 609]
        : toArNum(printedOf(currentPage)) + " / " + toArNum(PRINTED_TOTAL);
  document.getElementById("prevBtn").disabled = currentPage >= TOTAL_PAGES;
  document.getElementById("nextBtn").disabled = currentPage <= 1;
}
function go(dir) {
  if (turning) return;
  const np = currentPage + dir;
  if (np < 1 || np > TOTAL_PAGES) return;
  turning = true;
  currentPage = np;
  pageBlock.classList.remove("turn-next", "turn-prev");
  void pageBlock.offsetWidth;
  pageBlock.classList.add(dir > 0 ? "turn-next" : "turn-prev");
  render(); showCurrentPage(); updateYouAreHere();
  setTimeout(() => { turning = false; }, 320);
}
/* زي الكتاب المطبوع: الغلاف أول صفحة على اليمين، وسهم الشمال يتقدم */
document.getElementById("nextBtn").addEventListener("click", () => { play(sfxClick); go(-1); });
document.getElementById("prevBtn").addEventListener("click", () => { play(sfxClick); go(1); });
document.getElementById("backBtn").addEventListener("click", () => { play(sfxClick); closeReader(); });
function openReader() {
  reader.classList.add("show");
  requestAnimationFrame(() => requestAnimationFrame(() => reader.classList.add("visible")));
  render(); showCurrentPage(); updateYouAreHere();
}
function closeReader() {
  reader.classList.remove("visible");
  setTimeout(() => reader.classList.remove("show"), 450);
}
/* سحب بالإصبع: RTL — سحب من يمين لشمال = تقدم */
let touchX = null;
pageBlock.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
pageBlock.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) { play(sfxClick); go(dx < 0 ? 1 : -1); }
  touchX = null;
}, { passive: true });

/* ============ بلوك التخصيص ============ */
const customOverlay = document.getElementById("customOverlay");
document.getElementById("customBtn").addEventListener("click", () => { play(sfxClick); customOverlay.classList.add("open"); });
function closeCustom() { customOverlay.classList.remove("open"); }
document.getElementById("customClose").addEventListener("click", () => { play(sfxClick); closeCustom(); });
customOverlay.addEventListener("click", e => { if (e.target === customOverlay) closeCustom(); });

/* ============ محرك الانتقال السريع ============ */
const NAV = {"surahs": [[1, "الفاتحة", 4], [2, "البقرة", 5], [3, "آل عمران", 53], [4, "النساء", 80], [5, "المائدة", 109], [6, "الأنعام", 131], [7, "الأعراف", 154], [8, "الأنفال", 180], [9, "التوبة", 190], [10, "يونس", 211], [11, "هود", 224], [12, "يوسف", 238], [13, "الرعد", 252], [14, "إبراهيم", 258], [15, "الحجر", 264], [16, "النحل", 270], [17, "الإسراء", 285], [18, "الكهف", 296], [19, "مريم", 308], [20, "طه", 315], [21, "الأنبياء", 325], [22, "الحج", 335], [23, "المؤمنون", 345], [24, "النور", 353], [25, "الفرقان", 362], [26, "الشعراء", 370], [27, "النمل", 380], [28, "القصص", 388], [29, "العنكبوت", 399], [30, "الروم", 407], [31, "لقمان", 414], [32, "السجدة", 418], [33, "الأحزاب", 421], [34, "سبأ", 431], [35, "فاطر", 437], [36, "يس", 443], [37, "الصافات", 449], [38, "ص", 454], [39, "الزمر", 461], [40, "غافر", 470], [41, "فصلت", 480], [42, "الشورى", 486], [43, "الزخرف", 492], [44, "الدخان", 499], [45, "الجاثية", 502], [46, "الأحقاف", 505], [47, "محمد", 510], [48, "الفتح", 514], [49, "الحجرات", 518], [50, "ق", 521], [51, "الذاريات", 523], [52, "الطور", 526], [53, "النجم", 529], [54, "القمر", 531], [55, "الرحمن", 534], [56, "الواقعة", 537], [57, "الحديد", 540], [58, "المجادلة", 545], [59, "الحشر", 548], [60, "الممتحنة", 552], [61, "الصف", 554], [62, "الجمعة", 556], [63, "المنافقون", 557], [64, "التغابن", 559], [65, "الطلاق", 561], [66, "التحريم", 563], [67, "الملك", 565], [68, "القلم", 567], [69, "الحاقة", 569], [70, "المعارج", 571], [71, "نوح", 573], [72, "الجن", 575], [73, "المزمل", 577], [74, "المدثر", 578], [75, "القيامة", 580], [76, "الإنسان", 581], [77, "المرسلات", 583], [78, "النبأ", 585], [79, "النازعات", 586], [80, "عبس", 588], [81, "التكوير", 589], [82, "الانفطار", 590], [83, "المطففين", 591], [84, "الانشقاق", 592], [85, "البروج", 593], [86, "الطارق", 594], [87, "الأعلى", 594], [88, "الغاشية", 595], [89, "الفجر", 596], [90, "البلد", 597], [91, "الشمس", 598], [92, "الليل", 598], [93, "الضحى", 599], [94, "الشرح", 599], [95, "التين", 600], [96, "العلق", 600], [97, "القدر", 601], [98, "البينة", 601], [99, "الزلزلة", 602], [100, "العاديات", 602], [101, "القارعة", 603], [102, "التكاثر", 603], [103, "العصر", 604], [104, "الهمزة", 604], [105, "الفيل", 604], [106, "قريش", 605], [107, "الماعون", 605], [108, "الكوثر", 605], [109, "الكافرون", 605], [110, "النصر", 606], [111, "المسد", 606], [112, "الإخلاص", 607], [113, "الفلق", 607], [114, "الناس", 607]], "sajdas": [[1, "سجدة الأعراف", 180], [2, "سجدة الرعد", 254], [3, "سجدة النحل", 276], [4, "سجدة الإسراء", 296], [5, "سجدة مريم", 312], [6, "سجدة الحج", 337], [7, "سجدة الفرقان", 368], [8, "سجدة النمل", 382], [9, "سجدة السجدة", 419], [10, "سجدة ص", 456], [11, "سجدة فصلت", 484], [12, "سجدة النجم", 531], [13, "سجدة الانشقاق", 593], [14, "سجدة العلق", 600]]};

const CONTENT_START = 4, CONTENT_END = 607;
const ABJAD = ["ا", "ب", "ج", "د", "ه", "و", "ز", "ح", "ط", "ي", "ك", "ل", "م", "ن", "س", "ع", "ف"];
const ABJAD_NAMES = ["الألف", "الباء", "الجيم", "الدال", "الهاء", "الواو", "الزاي", "الحاء", "الطاء", "الياء", "الكاف", "اللام", "الميم", "النون", "السين", "العين", "الفاء"];
function jumpToPdfPage(p) {
  p = Math.max(CONTENT_START, Math.min(CONTENT_END, Math.round(p)));
  currentPage = p + 1;
  turning = true;
  pageBlock.classList.remove("turn-next", "turn-prev");
  void pageBlock.offsetWidth;
  pageBlock.classList.add("turn-next");
  render(); showCurrentPage(); updateYouAreHere();
  setTimeout(() => { turning = false; }, 320);
  play(sfxClick);
  closeCustom();
}
document.querySelectorAll(".nav-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    play(sfxClick);
    document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".nav-panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.querySelector('.nav-panel[data-panel="' + tab.dataset.tab + '"]').classList.add("active");
  });
});
/* 1) بالصفحة */
function pageJump() {
  const v = parseInt(toEn(document.getElementById("pageJumpInput").value.trim()), 10);
  if (!isNaN(v)) jumpToPdfPage(v + 3);
}
document.getElementById("pageJumpGo").addEventListener("click", pageJump);
document.getElementById("pageJumpInput").addEventListener("keydown", e => { if (e.key === "Enter") pageJump(); });
/* 2) بالسورة */
const normAr = s => s.replace(/[\u064B-\u0652]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/سوره|سورة/g, "").trim();
function renderSurahList(filter) {
  const list = document.getElementById("surahList");
  const f = normAr(filter || "");
  const items = NAV.surahs.filter(([n, name]) => {
    if (!f) return true;
    return normAr(name).includes(f) || String(n) === f || toArNum(n).includes(f);
  });
  list.innerHTML = items.length ? "" : '<div class="surah-empty">مفيش سورة بهذا الاسم</div>';
  items.forEach(([n, name, pdfp]) => {
    const b = document.createElement("button");
    b.className = "surah-item";
    b.innerHTML = '<span class="sname">' + name + '</span><span class="spage">ص ' + toArNum(pdfp - 3) + '</span>';
    b.addEventListener("click", () => jumpToPdfPage(pdfp));
    list.appendChild(b);
  });
}
document.getElementById("surahSearch").addEventListener("input", e => renderSurahList(e.target.value));
renderSurahList("");
/* 3) حزب + 4) ربع — توزيع حسابي */
function unitGrid(elId, count, calcPage) {
  const g = document.getElementById(elId);
  for (let i = 1; i <= count; i++) {
    const b = document.createElement("button");
    b.className = "unit-btn";
    b.textContent = toArNum(i);
    b.title = "صفحة " + toArNum(Math.round(calcPage(i)) - 3);
    b.addEventListener("click", () => jumpToPdfPage(calcPage(i)));
    g.appendChild(b);
  }
}
unitGrid("hizbGrid", 60, h => CONTENT_START + (h - 1) * (CONTENT_END - CONTENT_START) / 60);
unitGrid("rubGrid", 240, r => CONTENT_START + (r - 1) * (CONTENT_END - CONTENT_START) / 240);
/* 5) بالسجدة */
const sajdaList = document.getElementById("sajdaList");
NAV.sajdas.forEach(([n, name, pdfp]) => {
  const b = document.createElement("button");
  b.className = "sajda-item";
  b.innerHTML = '<span class="sajda-num">' + toArNum(n) + '</span><span class="sajda-name">' + name + '</span><span class="sajda-page">ص ' + toArNum(pdfp - 3) + '</span>';
  b.addEventListener("click", () => jumpToPdfPage(pdfp));
  sajdaList.appendChild(b);
});
/* سطر "أنت هنا" */
function updateYouAreHere() {
  const el = document.getElementById("youAreHere");
  const pdf = currentPage - 1;
  if (currentPage === 1) { el.innerHTML = "<b>الغلاف</b>"; return; }
  if (currentPage < 5) { el.innerHTML = "<b>المقدمة</b>"; return; }
  if (currentPage > 608) { el.innerHTML = "حرف <b>" + ABJAD_NAMES[currentPage - 609] + "</b>"; return; }
  const rel = pdf - CONTENT_START, span = CONTENT_END - CONTENT_START;
  const juz = Math.min(30, Math.floor(rel / span * 30) + 1);
  const hizb = Math.min(60, Math.floor(rel / span * 60) + 1);
  const rub = Math.min(240, Math.floor(rel / span * 240) + 1);
  el.innerHTML = "الجزء <span class=\"eq\">=</span> <b>" + toArNum(juz) + "</b> &nbsp;<span class=\"eq\">=</span>&nbsp; الحزب <span class=\"eq\">=</span> <b>" + toArNum(hizb) + "</b> &nbsp;<span class=\"eq\">=</span>&nbsp; الربع <span class=\"eq\">=</span> <b>" + toArNum(rub) + "</b>";
}
updateYouAreHere();
const _origRender = render;
render = function() { _origRender(); updateYouAreHere(); };


/* ============ علامة المصحف ============ */
const markBtn = document.getElementById("markBtn");
const markMenu = document.getElementById("markMenu");
const markRibbon = document.getElementById("markRibbon");
let bookmark = (() => { const v = parseInt(localStorage.getItem("mushaf_bookmark"), 10); return isNaN(v) ? null : v; })();

function updateBookmarkUI() {
  const onMark = bookmark !== null && currentPage === bookmark;
  markBtn.style.display = onMark ? "none" : "flex";
  markRibbon.style.display = onMark ? "block" : "none";
  document.getElementById("markGo").disabled = bookmark === null;
}
markBtn.addEventListener("click", e => {
  e.stopPropagation(); play(sfxClick);
  updateBookmarkUI();
  markMenu.classList.toggle("open");
});
document.getElementById("markSave").addEventListener("click", () => {
  play(sfxClick);
  bookmark = currentPage;
  localStorage.setItem("mushaf_bookmark", String(bookmark));
  markMenu.classList.remove("open");
  updateBookmarkUI();
  toast("تم حفظ العلامة \u2713");
});
document.getElementById("markGo").addEventListener("click", () => {
  if (bookmark === null) return;
  play(sfxClick);
  markMenu.classList.remove("open");
  currentPage = bookmark;
  turning = true;
  pageBlock.classList.remove("turn-next", "turn-prev");
  void pageBlock.offsetWidth;
  pageBlock.classList.add("turn-next");
  render(); showCurrentPage();
  setTimeout(() => { turning = false; }, 320);
});
document.addEventListener("click", e => {
  if (!markMenu.contains(e.target) && e.target !== markBtn) markMenu.classList.remove("open");
});
const _markRender = render;
render = function() { _markRender(); updateBookmarkUI(); };
updateBookmarkUI();

/* ============ وضع الزوم ============ */
const zoomOverlay = document.getElementById("zoomOverlay");
const zoomStage = document.getElementById("zoomStage");
const zoomImg = document.getElementById("zoomImg");
const zoomCounter = document.getElementById("zoomCounter");
let zScale = 1, zTx = 0, zTy = 0;
let zTouches = [], zStartDist = 0, zStartScale = 1, zStartMid = null;
let zSwipeX = null, zLastTap = 0;

function zoomSrc() {
  return (typeof SAMPLES !== "undefined" && SAMPLES[currentPage])
    || ("pages/p" + String(currentPage - 1).padStart(3, "0") + ".webp");
}
function zApply() {
  zoomImg.style.transform = "translate(" + zTx + "px," + zTy + "px) scale(" + zScale + ")";
}
function zClamp() {
  zScale = Math.min(4, Math.max(1, zScale));
  const vw = innerWidth, vh = innerHeight;
  const iw = zoomImg.clientWidth * zScale, ih = zoomImg.clientHeight * zScale;
  const mx = Math.max(0, (iw - vw) / 2 + 30), my = Math.max(0, (ih - vh) / 2 + 30);
  if (iw <= vw) zTx = 0; else zTx = Math.min(mx, Math.max(-mx, zTx));
  if (ih <= vh) zTy = 0; else zTy = Math.min(my, Math.max(-my, zTy));
}
function zUpdateCounter() {
  zoomCounter.textContent = currentPage === 1 ? "الغلاف"
    : currentPage < 5 ? "المقدمة"
    : currentPage > 608 ? ABJAD[currentPage - 609]
    : (currentPage - 4) + " / 604";
}
function zReset() { zScale = 1; zTx = 0; zTy = 0; zApply(); }
function zSync() { if (!zoomOverlay.classList.contains("open")) return; zReset(); zoomImg.src = zoomSrc(); zUpdateCounter(); }

function openZoom() {
  play(sfxClick);
  zShowUI();
  zoomImg.src = zoomSrc();
  zReset(); zUpdateCounter();
  zoomOverlay.classList.add("open");
}
function closeZoom() { zoomOverlay.classList.remove("open"); zReset(); }

document.getElementById("zoomBtn").addEventListener("click", openZoom);
document.getElementById("zoomClose").addEventListener("click", () => { play(sfxClick); closeZoom(); });
document.getElementById("zoomIn").addEventListener("click", () => { zScale = Math.min(4, zScale + .4); zClamp(); zApply(); });
document.getElementById("zoomOut").addEventListener("click", () => { zScale = Math.max(1, zScale - .4); zClamp(); zApply(); });
document.getElementById("zoomReset").addEventListener("click", () => { play(sfxClick); zReset(); });

/* تقليب الصفحات من جوّه الزوم */
const _zoomRender = render;
render = function() { _zoomRender(); zSync(); };


/* واجهة الزوم الذكية: اختفاء غامر بعد سكون، وظهور بلمسة */
const zoomBar = document.querySelector(".zoom-bar");
const zoomUI = [zoomBar, zoomCounter, document.getElementById("zoomClose")];
let zUiTimer = null;
function zShowUI() {
  zoomUI.forEach(el => { if (el) el.style.opacity = 1; });
  clearTimeout(zUiTimer);
  zUiTimer = setTimeout(() => {
    if (matchMedia("(pointer: coarse)").matches)
      zoomUI.forEach(el => { if (el) el.style.opacity = 0; });
  }, 3000);
}
zoomOverlay.addEventListener("touchstart", zShowUI, { passive: true });
zoomOverlay.addEventListener("touchmove", () => { zoomUI.forEach(el => { if (el) el.style.opacity = 0; }); }, { passive: true });

/* لمس: pinch + pan + swipe + double-tap */
zoomStage.addEventListener("touchstart", e => {
  zTouches = Array.from(e.touches);
  if (zTouches.length === 2) {
    const dx = zTouches[1].clientX - zTouches[0].clientX, dy = zTouches[1].clientY - zTouches[0].clientY;
    zStartDist = Math.hypot(dx, dy); zStartScale = zScale;
    zStartMid = { x: (zTouches[0].clientX + zTouches[1].clientX) / 2, y: (zTouches[0].clientY + zTouches[1].clientY) / 2 };
  } else if (zTouches.length === 1) {
    zSwipeX = zTouches[0].clientX;
  }
}, { passive: true });

zoomStage.addEventListener("touchmove", e => {
  e.preventDefault();
  const t = Array.from(e.touches);
  if (t.length === 2) {
    const dx = t[1].clientX - t[0].clientX, dy = t[1].clientY - t[0].clientY;
    const d = Math.hypot(dx, dy);
    if (zStartDist > 0) { zScale = zStartScale * (d / zStartDist); zClamp(); zApply(); }
  } else if (t.length === 1 && zTouches.length === 1) {
    if (zScale > 1.02) {
      zTx += t[0].clientX - zTouches[0].clientX;
      zTy += t[0].clientY - zTouches[0].clientY;
      zClamp(); zApply();
    }
  }
  zTouches = t;
}, { passive: false });

zoomStage.addEventListener("touchend", e => {
  if (e.touches.length === 0 && zTouches.length === 1 && zScale <= 1.02 && zSwipeX !== null) {
    const dx = e.changedTouches[0].clientX - zSwipeX;
    if (Math.abs(dx) > 50) { play(sfxClick); go(dx < 0 ? 1 : -1); }
  }
  if (e.touches.length === 1) { zSwipeX = e.touches[0].clientX; } else { zSwipeX = null; }
  if (e.touches.length === 0) {
    const now = Date.now();
    if (now - zLastTap < 300) { /* دبل تاب */
      if (zScale > 1.02) zReset();
      else { zScale = 2.2; zClamp(); zApply(); }
    }
    zLastTap = now;
  }
  zTouches = Array.from(e.touches);
}, { passive: true });

/* لاب: عجلة + سحب + كيبورد */
zoomStage.addEventListener("wheel", e => {
  e.preventDefault();
  zScale *= e.deltaY < 0 ? 1.13 : 0.885;
  zClamp(); zApply();
}, { passive: false });
let zMouse = null;
zoomStage.addEventListener("mousedown", e => { zMouse = { x: e.clientX, y: e.clientY }; });
window.addEventListener("mousemove", e => {
  if (zMouse && zScale > 1.02) {
    zTx += e.clientX - zMouse.x; zTy += e.clientY - zMouse.y;
    zClamp(); zApply();
    zMouse = { x: e.clientX, y: e.clientY };
  }
});
window.addEventListener("mouseup", () => { zMouse = null; });
document.addEventListener("keydown", e => {
  if (!zoomOverlay.classList.contains("open")) return;
  if (e.key === "Escape") closeZoom();
  if (e.key === "ArrowLeft") { play(sfxClick); go(1); }
  if (e.key === "ArrowRight") { play(sfxClick); go(-1); }
});
</script>
